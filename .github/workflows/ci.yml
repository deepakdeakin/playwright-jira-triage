name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Runs the action itself, as a user would, against the committed Playwright report.
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Triage (dry run)
        id: triage
        uses: ./
        with:
          report-path: test/fixture-project/results.json
          dry-run: "true"
      - name: Check it found the 3 known problems
        run: |
          test "${{ steps.triage.outputs.failures }}" = "3" || { echo "expected 3, got ${{ steps.triage.outputs.failures }}"; exit 1; }
